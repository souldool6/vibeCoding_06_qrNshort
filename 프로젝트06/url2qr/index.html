<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>QR 코드 생성기</title>
  <meta name="description" content="URL을 입력하면 즉시 QR코드를 생성하고 JPG로 다운로드할 수 있는 무료 QR코드 생성기입니다." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <style>
/* ===== CSS Reset & Variables ===== */
*, *::before, *::after {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

:root {
  /* 밝은 노랑-오렌지-핑크 테마 (로고 색 기반) */
  --yellow:   #FFD600;
  --amber:    #FFAB00;
  --orange:   #FF6D00;
  --coral:    #FF4081;
  --peach:    #FF8A65;

  --bg-body:       #FFF9E6;     /* 아이보리 배경 */
  --bg-card:       rgba(255, 255, 255, 0.72);
  --bg-card-hover: rgba(255, 255, 255, 0.92);
  --text-primary:  #1A1200;
  --text-secondary:#6B4F00;
  --text-muted:    #A07B30;
  --border:        rgba(255, 180, 0, 0.25);
  --border-focus:  rgba(255, 109, 0, 0.55);
  --shadow-color:  rgba(255, 140, 0, 0.18);

  --radius-sm: 12px;
  --radius-md: 20px;
  --radius-lg: 28px;
  --font: 'Outfit', sans-serif;
  --transition: 0.35s cubic-bezier(0.4, 0, 0.2, 1);
}

html, body {
  height: 100%;
  font-family: var(--font);
  background: var(--bg-body);
  color: var(--text-primary);
  overflow-x: hidden;
}

/* ===== Dynamic Gradient Background ===== */
/* 마우스 위치에 따라 JS에서 --mx, --my CSS 변수를 업데이트 */
.gradient-bg {
  position: fixed;
  inset: 0;
  z-index: 0;
  pointer-events: none;
  /* 기본 그라디언트 – JS가 radial 위치를 갱신 */
  background:
    radial-gradient(ellipse 60% 55% at var(--mx, 30%) var(--my, 40%),
      rgba(255, 214, 0, 0.55) 0%,
      rgba(255, 171, 0, 0.30) 35%,
      transparent 70%),
    radial-gradient(ellipse 50% 50% at calc(100% - var(--mx, 30%)) calc(100% - var(--my, 40%)),
      rgba(255, 109, 0, 0.40) 0%,
      rgba(255, 64, 129, 0.22) 40%,
      transparent 70%),
    linear-gradient(145deg, #FFF9E6 0%, #FFF3CC 40%, #FFE0B2 75%, #FFCCBC 100%);
  transition: background 0.05s linear;
}

/* ===== Soft Noise Texture (SVG) ===== */
.gradient-bg::after {
  content: '';
  position: absolute;
  inset: 0;
  background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.04'/%3E%3C/svg%3E");
  background-size: 200px 200px;
  opacity: 0.5;
}

/* ===== Background Canvas (particles) ===== */
.bg-canvas {
  position: fixed;
  inset: 0;
  z-index: 1;
  pointer-events: none;
}

/* ===== Header ===== */
.header {
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  z-index: 100;
  padding: 16px 32px;
  display: flex;
  align-items: center;
  /* 반투명 유리 헤더 */
  background: rgba(255, 249, 230, 0.65);
  backdrop-filter: blur(14px);
  -webkit-backdrop-filter: blur(14px);
  border-bottom: 1px solid rgba(255, 200, 0, 0.2);
}

.logo-wrap {
  display: flex;
  align-items: center;
}

.logo {
  height: 40px;
  width: auto;
  object-fit: contain;
  border-radius: 8px;
  box-shadow: 0 4px 16px rgba(255, 171, 0, 0.35);
  transition: box-shadow var(--transition), transform var(--transition);
}

.logo:hover {
  box-shadow: 0 6px 24px rgba(255, 109, 0, 0.55);
  transform: scale(1.05) rotate(-1deg);
}

/* ===== Main Layout ===== */
.main {
  position: relative;
  z-index: 2;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 100px 20px 60px;
  gap: 36px;
  transition: justify-content var(--transition), padding-top var(--transition);
}

.main.qr-mode {
  justify-content: flex-start;
  padding-top: 110px;
}

/* ===== Hero Section ===== */
.hero {
  text-align: center;
  transition: opacity 0.4s ease, transform 0.4s ease;
}

.hero.hidden {
  opacity: 0;
  transform: translateY(-20px);
  pointer-events: none;
  position: absolute;
}

.hero-title {
  font-size: clamp(2.4rem, 5.5vw, 4rem);
  font-weight: 700;
  line-height: 1.12;
  letter-spacing: -0.03em;
  /* 노란→오렌지→코랄 그라디언트 텍스트 */
  background: linear-gradient(135deg, #E65C00 0%, #F9A825 45%, #FF6D00 80%, #E91E63 100%);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
  margin-bottom: 14px;
  filter: drop-shadow(0 2px 8px rgba(255, 109, 0, 0.20));
}

.hero-sub {
  font-size: 1.08rem;
  color: var(--text-secondary);
  font-weight: 400;
}

/* ===== QR Section ===== */
.qr-section {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 20px;
  opacity: 0;
  transform: scale(0.8) translateY(20px);
  transition: opacity 0.5s cubic-bezier(0.34, 1.56, 0.64, 1),
              transform 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
  pointer-events: none;
}

.qr-section.visible {
  opacity: 1;
  transform: scale(1) translateY(0);
  pointer-events: all;
}

/* QR 카드 – 노란-오렌지 테두리 글로우 */
.qr-card {
  position: relative;
  border-radius: var(--radius-lg);
  padding: 22px;
  background: #ffffff;
  box-shadow:
    0 0 0 3px rgba(255, 171, 0, 0.45),
    0 8px 32px rgba(255, 109, 0, 0.22),
    0 24px 64px rgba(255, 64, 129, 0.12);
  cursor: pointer;
  transition: transform var(--transition), box-shadow var(--transition);
  overflow: hidden;
}

.qr-card::before {
  content: '';
  position: absolute;
  inset: -2px;
  border-radius: calc(var(--radius-lg) + 2px);
  background: linear-gradient(135deg, var(--yellow), var(--amber), var(--orange), var(--coral));
  z-index: -1;
  opacity: 0;
  transition: opacity var(--transition);
}

.qr-card:hover::before {
  opacity: 1;
}

.qr-card:hover {
  transform: translateY(-8px) scale(1.02);
  box-shadow:
    0 0 0 3px transparent,
    0 16px 48px rgba(255, 109, 0, 0.35),
    0 32px 80px rgba(255, 64, 129, 0.2);
}

.qr-card:hover .qr-overlay {
  opacity: 1;
}

.qr-card canvas,
.qr-card img {
  display: block;
  border-radius: 6px;
}

/* QR Hover Overlay */
.qr-overlay {
  position: absolute;
  inset: 0;
  background: linear-gradient(135deg, rgba(255, 171, 0, 0.90), rgba(255, 64, 129, 0.88));
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 10px;
  opacity: 0;
  transition: opacity 0.28s ease;
  border-radius: var(--radius-lg);
  color: white;
}

.qr-overlay svg {
  width: 42px;
  height: 42px;
  filter: drop-shadow(0 2px 8px rgba(0,0,0,0.25));
  animation: bounce-dl 1.1s ease infinite;
}

@keyframes bounce-dl {
  0%, 100% { transform: translateY(0); }
  50% { transform: translateY(6px); }
}

.qr-overlay span {
  font-size: 1rem;
  font-weight: 700;
  letter-spacing: 0.06em;
  text-shadow: 0 1px 4px rgba(0,0,0,0.2);
}

.qr-url-label {
  max-width: 340px;
  text-align: center;
  font-size: 0.84rem;
  color: var(--text-muted);
  word-break: break-all;
  padding: 8px 18px;
  background: rgba(255, 255, 255, 0.7);
  border: 1px solid var(--border);
  border-radius: 100px;
  backdrop-filter: blur(8px);
}

.reset-btn {
  background: rgba(255, 255, 255, 0.6);
  border: 1.5px solid rgba(255, 171, 0, 0.4);
  color: var(--text-secondary);
  font-family: var(--font);
  font-size: 0.88rem;
  font-weight: 500;
  padding: 8px 24px;
  border-radius: 100px;
  cursor: pointer;
  transition: all var(--transition);
  backdrop-filter: blur(8px);
}

.reset-btn:hover {
  border-color: var(--orange);
  color: var(--orange);
  background: rgba(255, 109, 0, 0.08);
  transform: scale(1.03);
}

/* ===== Input Section ===== */
.input-section {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 10px;
  width: 100%;
  max-width: 600px;
  transition: all var(--transition);
}

.input-card {
  width: 100%;
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 7px 7px 7px 22px;
  background: rgba(255, 255, 255, 0.80);
  border: 1.5px solid var(--border);
  border-radius: 100px;
  backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);
  box-shadow: 0 4px 20px var(--shadow-color);
  transition: border-color var(--transition), box-shadow var(--transition), background var(--transition);
}

.input-card:focus-within {
  border-color: var(--border-focus);
  box-shadow:
    0 0 0 3px rgba(255, 109, 0, 0.12),
    0 8px 32px rgba(255, 171, 0, 0.25);
  background: rgba(255, 255, 255, 0.95);
}

.input-group {
  flex: 1;
  display: flex;
  align-items: center;
  gap: 12px;
  min-width: 0;
}

.input-icon {
  flex-shrink: 0;
  color: var(--text-muted);
  display: flex;
  align-items: center;
  transition: color var(--transition);
}

.input-icon svg {
  width: 18px;
  height: 18px;
}

.input-card:focus-within .input-icon {
  color: var(--orange);
}

.url-input {
  flex: 1;
  background: transparent;
  border: none;
  outline: none;
  font-family: var(--font);
  font-size: 1rem;
  font-weight: 400;
  color: var(--text-primary);
  caret-color: var(--orange);
  min-width: 0;
}

.url-input::placeholder {
  color: #C9A04A;
}

/* 생성 버튼 – 노랑→오렌지 그라디언트 */
.generate-btn {
  flex-shrink: 0;
  display: flex;
  align-items: center;
  gap: 7px;
  background: linear-gradient(135deg, var(--yellow) 0%, var(--amber) 50%, var(--orange) 100%);
  color: #1A0A00;
  font-family: var(--font);
  font-size: 0.95rem;
  font-weight: 700;
  padding: 11px 24px;
  border: none;
  border-radius: 100px;
  cursor: pointer;
  transition: transform var(--transition), box-shadow var(--transition), filter var(--transition);
  letter-spacing: 0.01em;
  box-shadow: 0 4px 18px rgba(255, 171, 0, 0.5);
}

.generate-btn:hover {
  transform: scale(1.05);
  box-shadow: 0 8px 28px rgba(255, 109, 0, 0.55);
  filter: brightness(1.05) saturate(1.1);
}

.generate-btn:active {
  transform: scale(0.97);
}

.btn-icon svg {
  width: 16px;
  height: 16px;
  transition: transform var(--transition);
}

.generate-btn:hover .btn-icon svg {
  transform: translateX(3px);
}

.input-hint {
  font-size: 0.82rem;
  color: #D32F2F;
  min-height: 18px;
}

/* ===== Blobs ===== */
.blob {
  position: fixed;
  border-radius: 50%;
  filter: blur(90px);
  pointer-events: none;
  z-index: 0;
  animation: blob-drift 14s ease-in-out infinite alternate;
}

.blob-1 {
  width: 520px; height: 520px;
  background: rgba(255, 214, 0, 0.35);
  top: -120px; left: -120px;
  animation-delay: 0s;
}

.blob-2 {
  width: 420px; height: 420px;
  background: rgba(255, 64, 129, 0.22);
  bottom: -100px; right: -80px;
  animation-delay: -5s;
}

.blob-3 {
  width: 350px; height: 350px;
  background: rgba(255, 109, 0, 0.20);
  top: 40%; left: 55%;
  animation-delay: -10s;
}

@keyframes blob-drift {
  0%   { transform: translate(0, 0) scale(1); }
  33%  { transform: translate(40px, -30px) scale(1.06); }
  66%  { transform: translate(-25px, 35px) scale(0.94); }
  100% { transform: translate(15px, 10px) scale(1.03); }
}

/* ===== Responsive ===== */
@media (max-width: 480px) {
  .header { padding: 12px 18px; }
  .logo { height: 34px; }
  .input-card { padding: 6px 6px 6px 16px; }
  .btn-text { display: none; }
  .generate-btn { padding: 11px 14px; }
}

  /* 페이지 간 이동 버튼: 원본 QR 생성기 테마 유지 */
  .tool-nav { margin-left:auto; display:inline-flex; align-items:center; gap:6px;
    color:#784400; background:rgba(255,255,255,.72); border:1px solid rgba(255,171,0,.30);
    border-radius:999px; padding:9px 15px; text-decoration:none; font-size:14px;
    font-weight:700; transition:background .2s, transform .2s; }
  .tool-nav:hover,.tool-nav:focus-visible { background:#fff; transform:translateY(-1px); }
  .logo-wrap > a { display:inline-flex; align-items:center; }
  .qr-api-help { display:none; max-width:550px; padding:10px 14px;
    background:#fff2ee; color:#a33e30; border:1px solid #ffc9c1;
    border-radius:10px; text-align:center; font-size:13px; line-height:1.6; }
  .qr-api-help.show { display:block; }
  @media(max-width:480px){.tool-nav{font-size:12px;padding:8px 11px}.qr-api-help{max-width:95%}}

</style>
</head>

  <script>
/* ===== app.js ===== */

// ------- DOM References -------
const urlInput     = document.getElementById('urlInput');
const generateBtn  = document.getElementById('generateBtn');
const inputSection = document.getElementById('inputSection');
const inputHint    = document.getElementById('inputHint');
const hero         = document.getElementById('hero');
const main         = document.getElementById('main');
const qrSection    = document.getElementById('qrSection');
const qrCard       = document.getElementById('qrCard');
const qrCanvas     = document.getElementById('qrCanvas');
const qrUrlLabel   = document.getElementById('qrUrlLabel');
const resetBtn     = document.getElementById('resetBtn');
const bgCanvas     = document.getElementById('bgCanvas');

// ------- QR 라이브러리 관련 -------
let qrInstance = null;     // QRCode 인스턴스 (내부 canvas/img 담을 div용)
let qrContainer = null;    // QRCode 가 렌더링되는 임시 div

// ------- 파티클 배경 (밝은 노랑-오렌지 계열) -------
(function initBackground() {
  const ctx = bgCanvas.getContext('2d');
  let W, H, particles = [];

  function resize() {
    W = bgCanvas.width  = window.innerWidth;
    H = bgCanvas.height = window.innerHeight;
  }

  class Particle {
    constructor() { this.reset(); }
    reset() {
      this.x  = Math.random() * W;
      this.y  = Math.random() * H;
      this.r  = Math.random() * 2.2 + 0.5;
      this.vx = (Math.random() - 0.5) * 0.3;
      this.vy = (Math.random() - 0.5) * 0.3;
      this.a  = Math.random() * 0.35 + 0.08;
      // 노랑(45°) / 오렌지(28°) / 코랄-핑크(350°) 계열
      const hues = [45, 38, 28, 20, 350, 15];
      this.hue = hues[Math.floor(Math.random() * hues.length)];
    }
    update() {
      this.x += this.vx;
      this.y += this.vy;
      if (this.x < 0 || this.x > W || this.y < 0 || this.y > H) this.reset();
    }
    draw() {
      ctx.beginPath();
      ctx.arc(this.x, this.y, this.r, 0, Math.PI * 2);
      ctx.fillStyle = `hsla(${this.hue}, 95%, 60%, ${this.a})`;
      ctx.fill();
    }
  }

  function initParticles() {
    particles = [];
    const count = Math.floor((W * H) / 7000);
    for (let i = 0; i < count; i++) particles.push(new Particle());
  }

  function loop() {
    ctx.clearRect(0, 0, W, H);
    particles.forEach(p => { p.update(); p.draw(); });
    requestAnimationFrame(loop);
  }

  resize();
  initParticles();
  loop();
  window.addEventListener('resize', () => { resize(); initParticles(); });
})();


// ------- 마우스 위치 → 그라디언트 배경 업데이트 -------
(function initMouseGradient() {
  const gradientBg = document.getElementById('gradientBg');
  // 현재 표시 좌표 (lerp 대상)
  let curX = 30, curY = 40;
  // 목표 좌표
  let targetX = 30, targetY = 40;

  // 색상 hue shift: 마우스 X→ 색조 변화 (±15°)
  let hueShift = 0;

  document.addEventListener('mousemove', (e) => {
    // 0~100% 비율
    targetX = (e.clientX / window.innerWidth)  * 100;
    targetY = (e.clientY / window.innerHeight) * 100;
    // X 위치에 따라 hue shift –15 ~ +15
    hueShift = ((e.clientX / window.innerWidth) - 0.5) * 30;
  });

  function lerpGradient() {
    // 부드러운 추적 (lerp factor)
    curX += (targetX - curX) * 0.07;
    curY += (targetY - curY) * 0.07;

    // 마우스 위치에 따라 CSS 변수 업데이트
    gradientBg.style.setProperty('--mx', `${curX.toFixed(2)}%`);
    gradientBg.style.setProperty('--my', `${curY.toFixed(2)}%`);

    // hue shift로 배경 색조 미세 변경
    const y1 = Math.max(0, Math.min(100, 45 + hueShift));    // 노랑 hue
    const o1 = Math.max(0, Math.min(100, 18 + hueShift * 0.5)); // 오렌지 hue

    gradientBg.style.background = [
      `radial-gradient(ellipse 60% 55% at ${curX.toFixed(1)}% ${curY.toFixed(1)}%,`,
      `  hsla(${y1.toFixed(0)}, 100%, 65%, 0.52) 0%,`,
      `  hsla(${y1.toFixed(0)}, 90%, 70%, 0.28) 35%,`,
      `  transparent 70%),`,
      `radial-gradient(ellipse 50% 50% at ${(100 - curX).toFixed(1)}% ${(100 - curY).toFixed(1)}%,`,
      `  hsla(${o1.toFixed(0)}, 100%, 60%, 0.38) 0%,`,
      `  hsla(350, 90%, 65%, 0.20) 40%,`,
      `  transparent 70%),`,
      `linear-gradient(145deg, #FFF9E6 0%, #FFF3CC 40%, #FFE0B2 75%, #FFCCBC 100%)`,
    ].join(' ');

    requestAnimationFrame(lerpGradient);
  }

  lerpGradient();
})();


// ------- 입력창 Enter 지원 -------
urlInput.addEventListener('keydown', (e) => {
  if (e.key === 'Enter') generateQR();
});

generateBtn.addEventListener('click', generateQR);
resetBtn.addEventListener('click', resetState);
qrCard.addEventListener('click', downloadQR);


// ------- URL 유효성 검사 -------
function isValidURL(str) {
  try {
    const url = new URL(str);
    return url.protocol === 'http:' || url.protocol === 'https:';
  } catch {
    return false;
  }
}

// ------- QR 생성 -------
function generateQR() {
  if (typeof QRCode === 'undefined') {
    showHint('QR 라이브러리를 연결하지 못했습니다. 인터넷 연결 확인 후 새로고침해 주세요.');
    const notice = document.getElementById('qrApiHelp');
    if (notice) notice.classList.add('show');
    return;
  }
  const rawVal = urlInput.value.trim();

  // 빈 값 처리
  if (!rawVal) {
    showHint('URL을 입력해 주세요.');
    shake(inputSection);
    return;
  }

  // http:// 없으면 자동 추가
  let url = rawVal;
  if (!/^https?:\/\//i.test(url)) url = 'https://' + url;

  if (!isValidURL(url)) {
    showHint('올바른 URL 형식이 아닙니다. (예: https://example.com)');
    shake(inputSection);
    return;
  }

  clearHint();

  // 기존 QR 인스턴스 제거
  if (qrContainer) {
    qrContainer.remove();
    qrContainer = null;
  }

  // qrcode.js 는 div에 canvas/img 를 붙이므로, 임시 div 생성
  qrContainer = document.createElement('div');
  qrContainer.style.display = 'none';
  document.body.appendChild(qrContainer);

  const qrSize = Math.min(260, window.innerWidth - 100);

  qrInstance = new QRCode(qrContainer, {
    text: url,
    width:  qrSize,
    height: qrSize,
    colorDark:  '#0f0f1a',
    colorLight: '#ffffff',
    correctLevel: QRCode.CorrectLevel.H,
  });

  // QRCode 내부 렌더링 완료 대기 (canvas or img)
  setTimeout(() => {
    const sourceEl = qrContainer.querySelector('canvas') || qrContainer.querySelector('img');
    if (!sourceEl) return;

    // 우리 qrCanvas 에 복사
    qrCanvas.width  = qrSize;
    qrCanvas.height = qrSize;
    const ctx = qrCanvas.getContext('2d');

    if (sourceEl.tagName === 'CANVAS') {
      ctx.drawImage(sourceEl, 0, 0);
    } else {
      // img 엘리먼트
      sourceEl.onload = () => ctx.drawImage(sourceEl, 0, 0);
      if (sourceEl.complete) ctx.drawImage(sourceEl, 0, 0);
    }

    qrUrlLabel.textContent = url.length > 50 ? url.slice(0, 47) + '...' : url;
    showQR();
  }, 150);
}

// ------- UI 상태 전환: QR 보여주기 -------
function showQR() {
  hero.classList.add('hidden');
  main.classList.add('qr-mode');

  setTimeout(() => {
    qrSection.classList.add('visible');
  }, 80);
}

// ------- UI 상태 전환: 초기화 -------
function resetState() {
  qrSection.classList.remove('visible');
  hero.classList.remove('hidden');
  main.classList.remove('qr-mode');
  urlInput.value = '';
  clearHint();

  // canvas 초기화
  const ctx = qrCanvas.getContext('2d');
  ctx.clearRect(0, 0, qrCanvas.width, qrCanvas.height);
  qrUrlLabel.textContent = '';

  if (qrContainer) {
    qrContainer.remove();
    qrContainer = null;
  }

  setTimeout(() => urlInput.focus(), 300);
}

// ------- QR 다운로드 (JPG) -------
function downloadQR() {
  // 흰 배경 위에 QR 합성해서 JPG로 저장 (JPG는 투명 배경 미지원)
  const offscreen = document.createElement('canvas');
  const padding = 24;
  offscreen.width  = qrCanvas.width  + padding * 2;
  offscreen.height = qrCanvas.height + padding * 2;

  const ctx = offscreen.getContext('2d');
  ctx.fillStyle = '#ffffff';
  ctx.fillRect(0, 0, offscreen.width, offscreen.height);
  ctx.drawImage(qrCanvas, padding, padding);

  const link = document.createElement('a');
  link.download = 'qrcode.jpg';
  link.href = offscreen.toDataURL('image/jpeg', 0.95);
  link.click();

  // 다운로드 피드백 애니메이션
  qrCard.style.transform = 'scale(0.96)';
  setTimeout(() => { qrCard.style.transform = ''; }, 200);
}

// ------- 힌트 표시/숨김 -------
function showHint(msg) {
  inputHint.textContent = msg;
}

function clearHint() {
  inputHint.textContent = '';
}

// ------- Shake 애니메이션 -------
function shake(el) {
  el.style.animation = 'none';
  el.offsetHeight; // reflow
  el.style.animation = 'shake 0.4s ease';
  el.addEventListener('animationend', () => { el.style.animation = ''; }, { once: true });
}

// Shake 키프레임을 동적으로 추가
const shakeStyle = document.createElement('style');
shakeStyle.textContent = `
  @keyframes shake {
    0%   { transform: translateX(0); }
    18%  { transform: translateX(-8px); }
    36%  { transform: translateX(8px); }
    54%  { transform: translateX(-6px); }
    72%  { transform: translateX(6px); }
    86%  { transform: translateX(-3px); }
    100% { transform: translateX(0); }
  }
`;
document.head.appendChild(shakeStyle);

// ------- Blob 배경 요소 동적 생성 (gradient-bg 다음에 삽입) -------
const gradBg = document.getElementById('gradientBg');
['blob-1', 'blob-2', 'blob-3'].forEach(cls => {
  const el = document.createElement('div');
  el.className = `blob ${cls}`;
  // gradient-bg 바로 뒤에 삽입
  gradBg.parentNode.insertBefore(el, gradBg.nextSibling);
});

window.addEventListener('load', () => {
  setTimeout(() => urlInput.focus(), 200);
});

(function connectPages(){

  if (!forwarded) return;
  urlInput.value = forwarded;
  // URL을 입력할 수 있도록 유지하고 생성 버튼은 사용자 클릭으로 실행합니다.
})();
